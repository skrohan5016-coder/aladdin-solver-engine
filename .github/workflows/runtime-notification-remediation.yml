name: runtime-notification-remediation

on:
  push:
    branches:
      - agent/phase1-wire-contract-v1

permissions:
  contents: write

concurrency:
  group: runtime-notification-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    if: startsWith(github.event.head_commit.message, '[runtime-notification-remediation]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/phase1-wire-contract-v1
          fetch-depth: 0

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Apply and validate runtime notification remediation
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          cat scripts/.runtime-notification-remediation.* > scripts/runtime_notification_remediation.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/runtime_notification_remediation.py")
          text = path.read_text()
          replacements = {
              'marker = "// ---------- Notification (driver -> solver) ----------\\n"': 'marker = "type Notification struct {\\n"',
              'types.write_text(prefix + marker + block)': 'types.write_text(prefix + block)',
              "'a separate weekly/manual workflow compares the\\nfive authoritative files'": "'A separate weekly/manual workflow compares the\\nfive authoritative files'",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected patcher marker count for {old!r}: {text.count(old)}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python3 scripts/runtime_notification_remediation.py
          python3 - <<'PY'
          from pathlib import Path

          types = Path("internal/api/types.go")
          text = types.read_text()
          if '"errors"' not in text:
              old = '\t"encoding/json"\n'
              new = '\t"encoding/json"\n\t"errors"\n'
              if text.count(old) != 1:
                  raise SystemExit("types.go import insertion point changed")
              text = text.replace(old, new, 1)
          old = (
              '\tif trimmed[0] == \'[\' {\n'
              '\t\tvar values []uint64\n'
              '\t\tif err := json.Unmarshal(trimmed, &values); err != nil {\n'
              '\t\t\treturn fmt.Errorf("decode merged notification solution ids: %w", err)\n'
              '\t\t}\n'
              '\t\tif values == nil {\n'
              '\t\t\tvalues = []uint64{}\n'
              '\t\t}\n'
              '\t\tid.merged = values\n'
              '\t\treturn nil\n'
              '\t}'
          )
          new = (
              '\tif trimmed[0] == \'[\' {\n'
              '\t\tvar items []json.RawMessage\n'
              '\t\tif err := json.Unmarshal(trimmed, &items); err != nil {\n'
              '\t\t\treturn fmt.Errorf("decode merged notification solution ids: %w", err)\n'
              '\t\t}\n'
              '\t\tvalues := make([]uint64, len(items))\n'
              '\t\tfor index, item := range items {\n'
              '\t\t\tif bytes.Equal(bytes.TrimSpace(item), []byte("null")) {\n'
              '\t\t\t\treturn fmt.Errorf("decode merged notification solution id %d: null is not uint64", index)\n'
              '\t\t\t}\n'
              '\t\t\tif err := json.Unmarshal(item, &values[index]); err != nil {\n'
              '\t\t\t\treturn fmt.Errorf("decode merged notification solution id %d: %w", index, err)\n'
              '\t\t\t}\n'
              '\t\t}\n'
              '\t\tif items == nil {\n'
              '\t\t\tvalues = []uint64{}\n'
              '\t\t}\n'
              '\t\tid.merged = values\n'
              '\t\treturn nil\n'
              '\t}'
          )
          if text.count(old) != 1:
              raise SystemExit(f"merged-id decoder replacement count is {text.count(old)}")
          types.write_text(text.replace(old, new, 1))

          contract = Path("internal/contract/contract.go")
          text = contract.read_text()
          old = (
              '\tdecoder := json.NewDecoder(bytes.NewReader(raw))\n'
              '\tdecoder.UseNumber()\n'
              '\tvar value json.Number\n'
              '\tif err := decoder.Decode(&value); err != nil || value.String() == "" {\n'
              '\t\treturn fmt.Errorf("%s: expected uint64", path)\n'
              '\t}\n'
              '\tif _, err := strconv.ParseUint(value.String(), 10, 64); err != nil {\n'
              '\t\treturn fmt.Errorf("%s: expected uint64: %w", path, err)\n'
              '\t}\n'
              '\treturn nil'
          )
          new = (
              '\tvar value uint64\n'
              '\tif err := json.Unmarshal(raw, &value); err != nil {\n'
              '\t\treturn fmt.Errorf("%s: expected uint64: %w", path, err)\n'
              '\t}\n'
              '\treturn nil'
          )
          if text.count(old) != 1:
              raise SystemExit(f"uint64 validator replacement count is {text.count(old)}")
          contract.write_text(text.replace(old, new, 1))

          record_test = Path("internal/record/record_test.go")
          text = record_test.read_text()
          old = 'auctionID := "auction-42"'
          new = 'auctionID := "42"'
          if text.count(old) != 1:
              raise SystemExit(f"record auction ID replacement count is {text.count(old)}")
          record_test.write_text(text.replace(old, new, 1))
          PY
          rm scripts/.runtime-notification-remediation.*
          rm scripts/runtime_notification_remediation.py
          rm .github/workflows/runtime-notification-remediation.yml
          find . -type f -name '*.go' -print0 | xargs -0 gofmt -w
          python3 scripts/check_contract_fixtures.py
          python3 scripts/check_upstream_pin.py
          python3 scripts/generate_reference_vectors.py --check
          go test -count=1 ./internal/api ./internal/contract ./internal/record ./internal/server ./cmd/report ./cmd/contractcheck
          go test -race -count=1 ./internal/api ./internal/contract ./internal/record ./internal/server ./cmd/report ./cmd/contractcheck
          git diff --check

      - name: Commit validated clean tree
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m "fix: match pinned runtime notification DTO"
          git push origin HEAD:agent/phase1-wire-contract-v1
