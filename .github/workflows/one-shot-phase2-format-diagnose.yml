name: one-shot-phase2-format-diagnose

on:
  push:
    branches:
      - agent/phase2-offline-replay-v1

permissions:
  contents: write

jobs:
  diagnose:
    if: startsWith(github.event.head_commit.message, '[phase2-diagnose]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/phase2-offline-replay-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Publish clean formatted tree
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-phase2-format-diagnose.yml
          rm -f .github/workflows/one-shot-phase2-validate.yml
          find . -type f -name '*.go' -print0 | xargs -0 gofmt -w
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m 'chore: publish formatted Phase 2 replay candidate'
          git push origin HEAD:agent/phase2-offline-replay-v1

      - name: Run every governed gate on the clean tree
        run: bash scripts/ci.sh
