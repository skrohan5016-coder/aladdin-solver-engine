name: phase1-notification-review-fix

on:
  push:
    branches:
      - agent/phase1-wire-contract-v1

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

concurrency:
  group: phase1-notification-review-fix
  cancel-in-progress: true

jobs:
  remediate:
    if: startsWith(github.event.head_commit.message, '[phase1-review-fix]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/phase1-wire-contract-v1
          fetch-depth: 0

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Apply and validate fresh-review remediation
        run: |
          echo "623dd0c425ff6c74a37143b7acb27670986a69256d745d389aeafa2931825df4  scripts/.phase1_review_fix.py.gz" | sha256sum -c -
          gzip -dc scripts/.phase1_review_fix.py.gz > scripts/phase1_review_fix.py
          echo "fc26c7423f60f181722adb5dcca9ddcda3066be04a20098df9681094a6809af7  scripts/phase1_review_fix.py" | sha256sum -c -
          chmod +x scripts/phase1_review_fix.py
          python3 scripts/phase1_review_fix.py
          rm -f scripts/phase1_review_fix.py scripts/.phase1_review_fix.py.gz .phase1-review-trigger
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.go' -print0 | xargs -0 gofmt -w
          git diff --check
          bash scripts/ci.sh
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Commit validated remediation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test ! -e scripts/phase1_review_fix.py
          test ! -e scripts/.phase1_review_fix.py.gz
          test ! -e .phase1-review-trigger
          test -z "$(find scripts -type d -name __pycache__ -print -quit)"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve complete CoW notification identity"
          git push origin HEAD:agent/phase1-wire-contract-v1
