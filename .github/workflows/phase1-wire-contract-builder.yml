name: phase1-wire-contract-builder

on:
  push:
    branches:
      - agent/phase1-wire-contract-v1

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  build:
    if: startsWith(github.event.head_commit.message, '[phase1-builder]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/phase1-wire-contract-v1
          fetch-depth: 0

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and validate Phase 1
        run: |
          python3 scripts/phase1_builder.py
          rm scripts/phase1_builder.py
          rm .github/workflows/phase1-wire-contract-builder.yml
          find . -type f -name '*.go' -print0 | xargs -0 gofmt -w
          python3 scripts/generate_reference_vectors.py --check
          bash scripts/ci.sh
          git diff --check

      - name: Commit validated Phase 1 implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: pin and verify CoW wire contract fixtures"
          git push origin HEAD:agent/phase1-wire-contract-v1
