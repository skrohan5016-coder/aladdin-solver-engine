name: one-shot-phase2-validate

on:
  push:
    branches:
      - agent/phase2-offline-replay-v1

permissions:
  contents: write

concurrency:
  group: one-shot-phase2-validate
  cancel-in-progress: false

jobs:
  validate:
    if: startsWith(github.event.head_commit.message, '[phase2-finalize]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/phase2-offline-replay-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Format and run every governed gate
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-phase2-validate.yml
          find . -type f -name '*.go' -print0 | xargs -0 gofmt -w
          bash scripts/ci.sh
          git diff --check

      - name: Commit the validated clean tree
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m 'chore: format and validate Phase 2 replay foundation'
          git push origin HEAD:agent/phase2-offline-replay-v1
