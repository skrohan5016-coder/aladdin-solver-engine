name: one-shot-phase2-review-fix

on:
  push:
    branches:
      - agent/phase2-offline-replay-v1

permissions:
  contents: write

concurrency:
  group: one-shot-phase2-review-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    if: startsWith(github.event.head_commit.message, '[phase2-review-fix]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
      BRANCH: agent/phase2-offline-replay-v1
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/phase2-offline-replay-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify and apply digest-bound review remediation
        run: |
          set -euo pipefail
          chunks=(scripts/.phase2-review-fix.b64.00 scripts/.phase2-review-fix.b64.01 scripts/.phase2-review-fix.b64.02 scripts/.phase2-review-fix.b64.03 scripts/.phase2-review-fix.b64.04 scripts/.phase2-review-fix.b64.05)
          expected_chunk_hashes=(
            7bacda1562bac345f833ac4b3bef6f0ed70c4a6ca69da75ec03cc46cf7ecb590
            c639a3d68adde099e821a17a252490f5a50274ed54e1eaa41e52ed979ee6b6f5
            ca3f6240a611f620326cf06c71fdf2cb2f988aaa5b71d1e04c5cc97de877f4e9
            79d2384f010f876346e2f16bc487077aa945dde05b5c0879383f3b2cc58e7cc3
            e7213c1082654e1f3a6ace5fea17554c2b8cc33c324c756e493ca7d9d44cc560
            44ab3bc88dcf3995db5937d0adb8aa2ec9e4b5fa7c187d610f22d6b2588c7556
          )
          for index in "${!chunks[@]}"; do
            printf '%s  %s\n' "${expected_chunk_hashes[$index]}" "${chunks[$index]}" | sha256sum -c -
          done

          cat "${chunks[@]}" > /tmp/phase2-review-fix.b64
          printf '%s  %s\n' 'feabeed2b005738eb6e84dac780a8ba896620b9c9c96e6a5730aa95bd9f41963' /tmp/phase2-review-fix.b64 | sha256sum -c -
          base64 --decode /tmp/phase2-review-fix.b64 > /tmp/phase2-review-fix.tar.gz
          printf '%s  %s\n' 'd788bc10d05eae415d522e74b92f2be444d308e8ceab43fffa2e003f2f1f1dc1' /tmp/phase2-review-fix.tar.gz | sha256sum -c -
          gzip -t /tmp/phase2-review-fix.tar.gz

          mapfile -t entries < <(tar -tzf /tmp/phase2-review-fix.tar.gz | sort)
          expected=(
            .gitignore
            cmd/replay/main.go
            cmd/replay/main_test.go
            docs/PHASE2_OFFLINE_REPLAY.md
            internal/corpus/corpus.go
            internal/corpus/corpus_test.go
            internal/record/identity.go
            internal/record/identity_test.go
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [ "$(printf '%s\n' "${entries[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]; then
            printf 'unexpected remediation archive inventory\nactual:\n%s\nexpected:\n%s\n' \
              "$(printf '%s\n' "${entries[@]}")" "$(printf '%s\n' "${expected_sorted[@]}")" >&2
            exit 1
          fi

          tar --extract --gzip --file /tmp/phase2-review-fix.tar.gz --directory . --no-same-owner --no-same-permissions
          rm -f scripts/.phase2-review-fix.tar.gz
          rm -f "${chunks[@]}"
          rm .github/workflows/one-shot-phase2-review-fix.yml
          find . -type f -name '*.go' -print0 | xargs -0 gofmt -w
          if git check-ignore -q cmd/replay/main.go; then
            echo 'cmd/replay remains ignored' >&2
            exit 1
          fi
          test -f cmd/replay/main.go
          test -f cmd/replay/main_test.go
          git diff --check

      - name: Run complete governed validation
        run: |
          set -euo pipefail
          python3 scripts/check_contract_fixtures.py
          python3 scripts/check_upstream_pin.py
          python3 scripts/generate_reference_vectors.py --check
          go test -count=1 ./...
          go test -race -count=1 ./...
          bash scripts/ci.sh
          git diff --check

      - name: Commit validated clean remediation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m 'fix: harden offline corpus publication and identity'
          git push origin HEAD:"$BRANCH"
