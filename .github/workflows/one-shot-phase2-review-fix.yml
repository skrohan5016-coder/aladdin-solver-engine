name: one-shot-phase2-review-fix

on:
  push:
    branches:
      - agent/phase2-offline-replay-v1

permissions:
  contents: write

jobs:
  remediate:
    if: startsWith(github.event.head_commit.message, '[phase2-review-fix]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/phase2-offline-replay-v1
          persist-credentials: false
      - name: Diagnose without extracting
        run: |
          set -euo pipefail
          PAYLOAD=scripts/.phase2-review-fix.tar.gz
          sha256sum "$PAYLOAD"
          gzip -t "$PAYLOAD"
          tar -tzf "$PAYLOAD" | sort
          exit 1
