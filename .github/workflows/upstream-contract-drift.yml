name: upstream-contract-drift

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-contract-drift
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Compare accepted pin with upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream_drift.py --verify-pinned
