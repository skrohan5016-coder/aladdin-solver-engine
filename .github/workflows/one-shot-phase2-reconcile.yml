          var sourceCommit = buildinfo.Commit

          type stringList []string

          func (values *stringList) String() string { return fmt.Sprint([]string(*values)) }
          func (values *stringList) Set(value string) error {
          	if value == "" {
          		return errors.New("input path is empty")
          	}
          	*values = append(*values, value)
          	return nil
          }

          func main() {
          	if err := run(os.Args[1:]); err != nil {
          		fmt.Fprintln(os.Stderr, "replay:", err)
          		os.Exit(1)
          	}
          }

          func run(arguments []string) error {
          	if len(arguments) == 0 {
          		return errors.New("expected build or verify subcommand")
          	}
          	switch arguments[0] {
          	case "build":
          		return runBuild(arguments[1:])
          	case "verify":
          		return runVerify(arguments[1:])
          	default:
          		return fmt.Errorf("unknown subcommand %q", arguments[0])
          	}
          }

          func runBuild(arguments []string) error {
          	flags := flag.NewFlagSet("replay build", flag.ContinueOnError)
          	flags.SetOutput(os.Stderr)
          	var inputs stringList
          	flags.Var(&inputs, "input", "full-auction recorder JSONL path; repeatable")
          	output := flags.String("out", "", "new corpus directory")
          	redact := flags.Bool("redact-signatures", true, "replace order signatures with 0x in the corpus")
          	maxInputBytes := flags.Int64("max-input-bytes", corpus.DefaultMaxInputBytes, "combined recorder input byte limit")
          	maxCorpusBytes := flags.Int64("max-corpus-bytes", corpus.DefaultMaxCorpusBytes, "canonical corpus byte limit")
          	maxLineBytes := flags.Int("max-line-bytes", corpus.DefaultMaxLineBytes, "maximum JSONL line bytes")
          	maxRecords := flags.Int("max-records", corpus.DefaultMaxRecords, "maximum auction records")
          	if err := flags.Parse(arguments); err != nil {
          		return err
          	}
          	if flags.NArg() != 0 {
          		return fmt.Errorf("unexpected build arguments: %v", flags.Args())
          	}
          	manifest, err := corpus.Build(context.Background(), corpus.BuildOptions{
          		Inputs:           inputs,
          		OutputDir:        *output,
          		Runtime:          runtimeIdentity(),
          		RedactSignatures: *redact,
          		Limits: corpus.Limits{
          			MaxInputBytes:  *maxInputBytes,
          			MaxCorpusBytes: *maxCorpusBytes,
          			MaxLineBytes:   *maxLineBytes,
          			MaxRecords:     *maxRecords,
          		},
          	})
          	if err != nil {
          		return err
          	}
          	return writeJSON(os.Stdout, manifest)
          }

          func runVerify(arguments []string) error {
          	flags := flag.NewFlagSet("replay verify", flag.ContinueOnError)
          	flags.SetOutput(os.Stderr)
          	directory := flags.String("corpus", "", "corpus directory")
          	reportPath := flags.String("report", "", "optional atomic report output path")
          	maxCorpusBytes := flags.Int64("max-corpus-bytes", corpus.DefaultMaxCorpusBytes, "canonical corpus byte limit")
          	maxLineBytes := flags.Int("max-line-bytes", corpus.DefaultMaxLineBytes, "maximum JSONL line bytes")
          	maxRecords := flags.Int("max-records", corpus.DefaultMaxRecords, "maximum auction records")
          	if err := flags.Parse(arguments); err != nil {
          		return err
          	}
          	if flags.NArg() != 0 {
          		return fmt.Errorf("unexpected verify arguments: %v", flags.Args())
          	}
          	report, err := corpus.VerifyAndReplay(context.Background(), corpus.VerifyOptions{
          		CorpusDir: *directory,
          		Runtime:   runtimeIdentity(),
          		Limits: corpus.Limits{
          			MaxCorpusBytes: *maxCorpusBytes,
          			MaxLineBytes:   *maxLineBytes,
          			MaxRecords:     *maxRecords,
          		},
          	})
          	if err != nil {
          		return err
          	}
          	if *reportPath != "" {
          		if err := corpus.WriteJSONAtomic(*reportPath, report, 0o640); err != nil {
          			return fmt.Errorf("write report: %w", err)
          		}
          	}
          	return writeJSON(os.Stdout, report)
          }

          func runtimeIdentity() corpus.RuntimeIdentity {
