name: phase1-wire-contract-build

on:
  push:
    branches:
      - agent/phase1-wire-contract-v1

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

concurrency:
  group: phase1-wire-contract-build
  cancel-in-progress: true

jobs:
  build:
    if: startsWith(github.event.head_commit.message, '[phase1-build]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/phase1-wire-contract-v1
          fetch-depth: 0

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify, apply, and validate Phase 1
        run: |
          cat scripts/.phase1_payload.b64.* | base64 -d > /tmp/phase1_apply.py.gz
          echo "930e701106c7529f15f8b54e5333879ef1a347c6a2af890d2445e945c5a025b9  /tmp/phase1_apply.py.gz" | sha256sum -c -
          gzip -dc /tmp/phase1_apply.py.gz > scripts/phase1_apply.py
          echo "27dcf21bdf69808e4afb10700fa1ba102c17a1e431e378a31e00d36f2a6bdc87  scripts/phase1_apply.py" | sha256sum -c -
          chmod +x scripts/phase1_apply.py
          python3 scripts/phase1_apply.py
          rm -f scripts/phase1_apply.py scripts/.phase1_payload.b64.* scripts/.phase1_apply.b64.*
          rm -f .github/workflows/phase1-wire-contract-build.yml .phase1-trigger
          python3 scripts/generate_reference_vectors.py --write
          find . -type f -name '*.go' -print0 | xargs -0 gofmt -w
          git diff --check
          bash scripts/ci.sh

      - name: Commit validated Phase 1
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test ! -e .phase1-trigger
          test ! -e .github/workflows/phase1-wire-contract-build.yml
          test -z "$(find scripts -maxdepth 1 -type f \( -name '.phase1_*' -o -name 'phase1_apply.py' \) -print)"
          git add -A
          git diff --cached --check
          git commit -m "feat: continuously verify the CoW wire contract"
          git push origin HEAD:agent/phase1-wire-contract-v1
